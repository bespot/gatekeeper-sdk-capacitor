// Top-level build file where you can add configuration options common to all sub-projects/modules.

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://artifactory.bespot.com/artifactory/bespot-antifraud" }
        maven { url "https://artifactory.bespot.com/artifactory/bespot-logger" }
        maven { url "https://jitpack.io" }
    }
    ext {
        getLocalProperty = { String key ->
            return localProperties.getProperty(key) ?: ""
        }
        getLocalPropertyFormatted = { String key ->
            return "\"${getLocalProperty(key)}\""
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
